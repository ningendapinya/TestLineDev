<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผ่าน LINE</title>
  <!-- เรียกใช้งาน LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; }
    img { width: 100px; height: 100px; border-radius: 50%; margin-bottom: 15px; }
    button { background: #06C755; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; }
    button:disabled { background: #ccc; }
  </style>
</head>
<body>

  <img id="pictureUrl" src="https://via.placeholder.com/100" alt="Profile">
  <h2 id="displayName">กำลังโหลดข้อมูล...</h2>
  <button id="btnSave" onclick="sendData()" disabled>บันทึกข้อมูลลงระบบ</button>

  <script>
    const liffId = "https://liff.line.me/2012806089-PjGK8mJR"; // นำ LIFF ID จากขั้นตอนที่ 3 มาใส่ตรงนี้
    const gasUrl = "https://script.google.com/macros/s/AKfycbx_0z0Cl-m3C1iPaRto1HxaJCgUZctFa_KKjoCPsnk7L_p495nX8lYlusI8-TpfAr4C-Q/exec"; // นำ URL จากขั้นตอนที่ 1 มาใส่ตรงนี้
    let userProfile = {};

    async function main() {
      await liff.init({ liffId: liffId });
      if (!liff.isLoggedIn()) {
        liff.login(); // บังคับล็อกอินหากเปิดนอกแอป LINE
      } else {
        userProfile = await liff.getProfile();
        document.getElementById("pictureUrl").src = userProfile.pictureUrl;
        document.getElementById("displayName").innerText = userProfile.displayName;
        document.getElementById("btnSave").disabled = false;
      }
    }

    async function sendData() {
      document.getElementById("btnSave").innerText = "กำลังบันทึก...";
      document.getElementById("btnSave").disabled = true;

      await fetch(gasUrl, {
        method: "POST",
        mode: "no-cors", // ป้องกันปัญหา CORS ของ Google Apps Script
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: userProfile.userId,
          displayName: userProfile.displayName,
          pictureUrl: userProfile.pictureUrl
        })
      });

      alert("บันทึกข้อมูลเรียบร้อยแล้ว!");
      liff.closeWindow(); // ปิดหน้าต่าง LIFF กลับเข้าห้องแชท
    }

    main();
  </script>
</body>
</html>
